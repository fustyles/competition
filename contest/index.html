	<!-- ===== 統一色系（覆寫上方 CSS，需放在所有 link 之後） ===== -->
	<style>
		:root {
			--brand:       #4C5C8F;   /* 主色：與試題標題卡同色系 */
			--brand-dark:  #3B4A78;
			--brand-soft:  #EEF1F8;   /* 淺底：hover、選取 */
			--line:        #E2E6EF;   /* 分隔線 */
			--run:         #4CA35A;   /* 執行：呼應「迴圈」綠 */
			--run-dark:    #3D8A4A;
			--test:        #3F82C4;   /* 驗證：呼應藍色系 */
		}

		/* ---------- 上方工具列 ---------- */
		#main > table {
			width: 100%;
			height: 64px;
			border-collapse: collapse;
			background: #fff;
			border-bottom: 1px solid var(--line);
		}
		#tabs { align-items: center; }
		#tabs li a {
			color: var(--brand);
			font-weight: 600;
			font-size: 18px;
		}
		#tabs > a,
		#lang-toggle {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 56px;
			height: 56px;
			margin: 0 2px;
			border-radius: 10px;
			transition: background-color .2s, color .2s;
		}
		#tabs > a .material-icons,
		#lang-toggle.material-icons {
			font-size: 44px;
			padding: 0;
			line-height: 1;
			color: var(--brand);
		}
		#tabs > a:hover,
		#lang-toggle:hover { background: var(--brand-soft); }

		/* 執行：主要動作，實心綠色按鈕 */
		#button_run { background: var(--run); }
		#button_run:hover { background: var(--run-dark); }
		#tabs > #button_run .material-icons { color: #fff; }
		/* 驗證：藍色 */
		#tabs > #button_test .material-icons { color: var(--test); }

		.lang-wrap { display: inline-flex; align-items: center; }

		/* 工具列按鈕分組 */
		#tabs.toolbar-buttons { display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; }
		#tabs .tb-sep {
			display: inline-block;
			width: 1px;
			height: 30px;
			margin: 0 8px;
			background: var(--line);
		}
		.lang-option:hover  { background: var(--brand-soft); }
		.lang-option.active { color: var(--brand); }

		/* ---------- 試題內容視窗 / 對話框標題列 ---------- */
		#javascript_content {
			border: 1px solid var(--line);
			border-radius: 8px;
			box-shadow: 0 4px 14px rgba(40, 50, 90, .15);
		}
		.ui-widget-header {
			background: var(--brand);
			border-color: var(--brand);
		}
		/* 試題內容標題列：淺底藍字，避免與下方深藍題目卡連成一片 */
		#javascript_title.ui-widget-header {
			background: var(--brand-soft);
			border: none;
			border-bottom: 1px solid var(--line);
			color: var(--brand);
			border-radius: 7px 7px 0 0;
		}
		#javascript_title .material-icons {
			font-size: 26px;
			color: var(--brand) !important;   /* 覆寫 HTML 內的 color: white */
		}
		#javascript_title a:hover .material-icons { color: var(--brand-dark) !important; opacity: .75; }

		/* ---------- 訊息視窗 ---------- */
		#consoleLog { border-color: var(--line); border-radius: 8px; }
		#console_header { background: var(--brand); }

		/* ---------- 建立積木 / 匯入題目 對話框 ---------- */
		.modal-container .header {
			background: var(--brand);
			color: #fff;
		}
		.action-button:hover { background: var(--brand-soft); }
		#confirmButton {
			background: var(--brand);
			border-color: var(--brand);
		}
		#confirmButton:hover { background: var(--brand-dark); }
		#importQuestion_list { border-color: #C9CFDD; }
		#importQuestionsList { border-color: var(--line); border-radius: 6px; }
		#importQuestionTable,
		#importQuestionTable tr,
		#importQuestionTable td { border-color: #C9CFDD; }

		/* ---------- 試題內容視窗：三個頁籤 ---------- */
		/* 每次只顯示一個區塊；用 !important 蓋過程式中對高度、顯示的直接設定 */
		/* 選取中的頁籤：白底深色字＋琥珀色上緣，避免與下方深藍色題目卡混在一起 */
		#question_tabs {
			display: flex;
			gap: 4px;
			height: 40px;
			padding: 5px 8px 0;
			box-sizing: border-box;
			background: #E4E8F2;
			border-bottom: 1px solid #CBD2E1;
		}
		#question_tabs .qtab {
			flex: 1;
			border: 1px solid transparent;
			border-bottom: none;
			border-radius: 8px 8px 0 0;
			background: transparent;
			color: #6B7489;
			font-size: 15px;
			font-weight: bold;
			font-family: inherit;
			cursor: pointer;
		}
		#question_tabs .qtab:hover { background: rgba(255,255,255,.55); color: var(--brand-dark); }
		#question_tabs .qtab.active {
			position: relative;
			top: 1px;                         /* 蓋住下方分隔線，與內容區連成一體 */
			background: #fff;
			border-color: #CBD2E1;
			border-top: 3px solid #F0A030;
			color: #1F2A44;
		}
		/* 題目區上方留白，讓題目卡與頁籤分開 */
		#javascript_content #question_input { padding-top: 10px !important; }
		#javascript_content #question_input,
		#javascript_content #iframe_output,
		#javascript_content #grade_panel {
			display: none !important;
			width: 100% !important;
			height: calc(100% - 40px) !important;
			box-sizing: border-box;
		}
		#javascript_content #question_input.qtab-active,
		#javascript_content #iframe_output.qtab-active,
		#javascript_content #grade_panel.qtab-active { display: block !important; }
		#javascript_content #question_splitter { display: none !important; }

		/* ---------- 正式評分頁籤 ---------- */
		#grade_panel {
			overflow: auto;
			padding: 12px 14px;
			background: #fff;
			border: 1px solid #ddd;
			font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
			font-size: 15px;
			color: #1f2937;
		}
		#grade_panel .gp-head {
			display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px;
			padding: 8px 12px; border-radius: 8px; background: var(--brand-soft); color: var(--brand);
		}
		#grade_panel .gp-actions { margin: 10px 0; }
		#grade_panel .gp-actions button {
			width: 100%; padding: 10px; border: 0; border-radius: 8px;
			background: var(--test); color: #fff; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer;
		}
		#grade_panel .gp-actions button:disabled { opacity: .55; cursor: wait; }
		#grade_panel .gp-score { font-size: 18px; margin: 6px 0 8px; }
		#grade_panel .gp-score b { font-size: 26px; color: #c2410c; }
		#grade_panel .gp-score span { display: block; font-size: 13px; color: #6b7280; margin-top: 2px; }
		#grade_panel .gp-msg { padding: 8px 10px; border-radius: 6px; background: #F6F7FB; color: #4b5563; line-height: 1.6; }
		#grade_panel .gp-err { background: #FEF2F2; color: #B91C1C; margin-bottom: 6px; }
		#grade_panel .gp-subtitle {
			margin: 16px 0 6px; padding-left: 8px; border-left: 4px solid var(--brand);
			font-weight: bold; color: var(--brand);
		}
		#grade_panel .gp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
		#grade_panel .gp-table th { background: #EEF1F7; color: #3A4A6B; padding: 6px; border: 1px solid #DDE2EC; }
		#grade_panel .gp-table td { padding: 6px; border: 1px solid #E5E8EF; text-align: center; }
		#grade_panel .gp-table th,
		#grade_panel .gp-table td { white-space: nowrap; }
		#grade_panel .gp-table td.gp-name { text-align: left; white-space: normal; }
		#grade_panel .gp-pass { color: #15803D; font-weight: bold; }
		#grade_panel .gp-fail { color: #B91C1C; font-weight: bold; }
		#grade_panel .gp-warn { color: #C2410C; font-weight: bold; }
		#grade_panel .gp-muted { color: #9CA3AF; }

		/* ---------- 執行中倒數動畫（全螢幕鎖定，避免重複按按鈕） ---------- */
		.run-watch {
			position: fixed;
			inset: 0;
			z-index: 2147482000;          /* 在所有畫面之上（登錄畫面除外） */
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(30, 38, 58, .45);
			cursor: wait;
			user-select: none;
			font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
		}
		.run-watch .rw-card {
			text-align: center;
			color: #1F2A44;
			background: #fff;
			padding: 30px 46px 26px;
			border-radius: 16px;
			box-shadow: 0 16px 48px rgba(0, 0, 0, .3);
			min-width: 280px;
		}
		.run-watch .rw-dial { position: relative; width: 120px; height: 120px; margin: 0 auto 14px; }
		.run-watch svg { width: 100%; height: 100%; transform: rotate(-90deg); }
		.run-watch .rw-ring-bg { fill: none; stroke: #DDE2EC; stroke-width: 5; }
		.run-watch .rw-ring-fg {
			fill: none; stroke: var(--brand); stroke-width: 5; stroke-linecap: round;
			transition: stroke-dashoffset .2s linear, stroke .3s;
		}
		.run-watch .rw-ring-fg.rw-warn { stroke: #DC2626; }
		.run-watch .rw-spin {           /* 外圈旋轉動畫 */
			position: absolute; inset: -9px; border-radius: 50%;
			border: 3px solid transparent; border-top-color: #F0A030; border-right-color: #F0A030;
			animation: rw-rotate 1s linear infinite;
		}
		.run-watch .rw-sec {
			position: absolute; inset: 0;
			display: flex; align-items: center; justify-content: center;
			font-size: 40px; font-weight: bold; color: var(--brand);
			font-variant-numeric: tabular-nums;
		}
		.run-watch .rw-title { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
		.run-watch .rw-title::after {   /* 文字後的跳動省略號 */
			content: ""; display: inline-block; width: 1.4em; text-align: left;
			animation: rw-dots 1.2s steps(4) infinite;
		}
		.run-watch .rw-sub { margin-top: 6px; font-size: 13px; color: #6B7489; }
		.run-watch.rw-paused .rw-spin { animation-play-state: paused; border-top-color: #CBD2E1; border-right-color: #CBD2E1; }
		.run-watch.rw-paused .rw-sub { color: #C2410C; font-weight: bold; }
		@keyframes rw-rotate { to { transform: rotate(360deg); } }

		/* ---------- Ctrl+Delete 清除暫存資料的確認視窗 ---------- */
		.clear-confirm {
			position: fixed; inset: 0; z-index: 2147482600;
			display: flex; align-items: center; justify-content: center;
			background: rgba(30, 38, 58, .55);
			font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
		}
		.clear-confirm .cc-box { width: min(420px, 92vw); background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,.35); }
		.clear-confirm .cc-head { background: #B91C1C; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: bold; letter-spacing: 2px; }
		.clear-confirm .cc-body { padding: 16px 20px 6px; font-size: 15px; line-height: 1.8; color: #374151; }
		.clear-confirm .cc-body ul { margin: 6px 0 8px; padding-left: 22px; }
		.clear-confirm .cc-warn { padding: 8px 10px; border-radius: 6px; background: #FEF2F2; color: #B91C1C; font-size: 14px; }
		.clear-confirm .cc-btns { display: flex; gap: 10px; padding: 14px 20px 18px; }
		.clear-confirm button { flex: 1; padding: 10px; font-size: 16px; font-weight: bold; font-family: inherit; border-radius: 8px; cursor: pointer; }
		.clear-confirm .cc-cancel { background: #fff; color: #4a5d85; border: 1px solid #7d8bb0; }
		.clear-confirm .cc-cancel:hover { background: #eef1f8; }
		.clear-confirm .cc-ok { background: #DC2626; color: #fff; border: 0; }
		.clear-confirm .cc-ok:hover { background: #B91C1C; }
		.clear-confirm button:focus-visible { outline: 3px solid #F0A030; outline-offset: 2px; }
		@keyframes rw-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
		#grade_panel .gp-records a { color: var(--test); font-weight: bold; }
		#grade_panel small { color: #6b7280; }

		/* 題目清單中的「匯入題目」按鈕 */
		#importQuestionTable .import-question-button:hover { filter: brightness(.95); }
	</style>
</head>
<body class="root">
<main id="main" class="has-tabs" >
    <!-- PAGE TABS -->
	<table>
		<tr>
			<td style="width: calc(100vw - 540px);text-align: center;vertical-align: middle;">

			     表格的 width 不含 padding：內容寬 504px＋左邊 padding 36px＝540px，
			     內容區為 100vw - 504px ～ 100vw，中心＝100vw - 252px -->

				</ul>

                <div id="importQuestionsList" style="overflow: auto;"></div>

                <button id="importCancelButton" class="action-button">取消</button>
            </div>           
        </div>
    </div>	
    
    <div id="consoleLog">
        <div id="console_header">
            <span id="console_title">訊息視窗</span>
            <a id="consoleCancelButton" title="Hide">
                <i class="material-icons">close</i>
            </a>
        </div>
        <div id="console_content">
            <div id="console_output"></div>
        </div>
    </div>       
</div>
</main>
