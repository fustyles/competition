<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競賽成績統計</title>
<style>
	:root {
		--ink: #1f2933; --muted: #6b7684; --line: #dde3ea; --bg: #f5f7fa; --card: #fff;
		--accent: #1d6fb8; --accent-soft: #e8f1fa; --err: #b42318; --err-soft: #fdecea;
	}
	* { box-sizing: border-box; }
	body { margin: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; }
	header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; }
	header h1 { margin: 0; font-size: 20px; }
	header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
	main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 18px; }
	.row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
	label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
	input[type=text], input[type=password], input[type=number], select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: #fff; min-width: 140px; }
	.check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 8px; }
	button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
	button.ghost { background: #fff; color: var(--accent); }
	button:disabled { opacity: .5; cursor: default; }
	#status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 1em; }
	#status.err { color: var(--err); }
	.stats { display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
	.stats b { color: var(--ink); font-size: 18px; margin-right: 2px; }
	.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
	.sec-head h2 { margin: 0; font-size: 17px; }
	.sec-head small { color: var(--muted); font-weight: normal; margin-left: 8px; }
	.scroll { overflow-x: auto; }
	table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
	th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: center; white-space: nowrap; }
	th { background: var(--accent-soft); font-weight: 600; position: sticky; top: 0; }
	td.l, th.l { text-align: left; }
	td.total { font-weight: 700; color: var(--accent); }
	td.none { color: #b8c0ca; }
	td.bad { background: var(--err-soft); color: var(--err); }
	td .n { font-size: 11px; color: var(--muted); margin-left: 3px; }
	tbody tr:hover td { background: #fafbfc; }
	.empty { color: var(--muted); padding: 24px; text-align: center; }
	.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
	<h1>競賽成績統計</h1>
	<p>讀取 Google 試算表（工作表 grade）；同一帳號同一題多次上傳時，以評分時間最新的一筆計分。</p>
</header>
<main>
	<section class="card">
		<div class="row">
			<label>管理密碼<input id="key" type="password" autocomplete="off"></label>
			<label class="check"><input id="remember" type="checkbox">在此電腦記住</label>
			<button id="load">讀取成績</button>
		</div>
		<div class="row" style="margin-top:12px">
			<label class="check"><input id="auto" type="checkbox" checked>自動更新</label>
			<label>更新間隔（秒）<input id="interval" type="number" min="3" step="1" value="10" style="width:80px;min-width:0"></label>
			<span id="countdown" style="padding-bottom:9px;font-size:13px;color:var(--muted)"></span>
		</div>
		<div id="status"></div>
	</section>

	<section class="card" id="filters" hidden>
		<div class="row">
			<label>競賽代碼<select id="fContest"></select></label>
			<label>競賽組別<select id="fGroup"></select></label>
			<label>登錄帳號搜尋<input id="fAccount" type="text" placeholder="例如 kh0"></label>
		</div>
		<div class="stats" style="margin-top:12px">
			<span><b id="sAcc">0</b>位考生</span>
			<span><b id="sQ">0</b>題</span>
			<span><b id="sRows">0</b>筆上傳紀錄</span>
		</div>
	</section>

	<section class="card" id="secTotal" hidden>
		<div class="sec-head">
			<h2>總成績<small>依登錄帳號排序</small></h2>
			<button class="ghost" id="csvTotal">下載 CSV</button>
		</div>
		<div class="scroll"><table id="tTotal"></table></div>
	</section>
	<section class="card" id="secDetail" hidden>
		<div class="sec-head">
			<h2>各題得分<small>依登錄帳號排序</small></h2>
			<button class="ghost" id="csvDetail">下載 CSV</button>
		</div>
		<div class="scroll"><table id="tDetail"></table></div>
		<div class="note">格子右下的小數字為該題上傳次數；紅底表示最新一次評分結果為「錯誤」（得分以 0 計）；「—」表示未上傳。滑鼠移到格子上可看評分時間。</div>
	</section>

</main>

<script>
(function () {
	var KEY_STORE = 'grade_report_key';
	var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzGmEnnR8Exi69YltU-nLoda-i-RfCwe431x_UDoqE_moZ4PZ_liEpuIypouOHCwJ8Isg/exec';   // Apps Script 網頁應用程式網址
	var $ = function (id) { return document.getElementById(id); };
	var allRows = [];   // 試算表原始資料（不含標題列）

	try {
		var k = localStorage.getItem(KEY_STORE);
		if (k) { $('key').value = k; $('remember').checked = true; }
	} catch (e) {}

	function setStatus(msg, isErr) {
		$('status').textContent = msg;
		$('status').className = isErr ? 'err' : '';
	}

	// ---------- 讀取：先用 fetch，失敗時改用 JSONP ----------
	function fetchData(url, key) {
		var q = url + (url.indexOf('?') < 0 ? '?' : '&') + 'action=list&key=' + encodeURIComponent(key) + '&t=' + Date.now();
		return fetch(q).then(function (r) { return r.json(); }).catch(function () { return jsonp(q); });
	}
	function jsonp(q) {
		return new Promise(function (resolve, reject) {
			var cb = '__grade_cb_' + Date.now();
			var s = document.createElement('script');
			var timer = setTimeout(function () { done(); reject(new Error('連線逾時')); }, 30000);
			function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
			window[cb] = function (data) { done(); resolve(data); };
			s.onerror = function () { done(); reject(new Error('無法連線到 Apps Script')); };
			s.src = q + '&callback=' + cb;
			document.head.appendChild(s);
		});
	}

	// ---------- 讀取與定時更新 ----------
	var INTERVAL_STORE = 'grade_report_interval';
	var loading = false, timer = null, nextAt = 0, loadedOnce = false;
	try {
		var iv = localStorage.getItem(INTERVAL_STORE);
		if (iv) $('interval').value = iv;
		if (localStorage.getItem(INTERVAL_STORE + '_auto') === '0') $('auto').checked = false;
	} catch (e) {}

	function intervalSec() {
		var n = Math.floor(Number($('interval').value));
		return n >= 3 ? n : 3;   // 最短 3 秒，避免過度呼叫 Apps Script
	}

	function loadData(manual) {
		var url = SCRIPT_URL, key = $('key').value;
		if (!key) { setStatus('請輸入管理密碼', true); stopTimer(); return; }
		if (loading) return;
		if (manual) {
			try {
				if ($('remember').checked) localStorage.setItem(KEY_STORE, key); else localStorage.removeItem(KEY_STORE);
			} catch (e) {}
		}
		loading = true;
		$('load').disabled = true;
		if (manual || !loadedOnce) setStatus('讀取中…');
		fetchData(url, key).then(function (data) {
			if (!data || !data.ok) {
				var err = new Error((data && data.error) || '讀取失敗');
				err.fatal = !!(data && /密碼/.test(data.error || ''));
				throw err;
			}
			allRows = data.rows || [];
			loadedOnce = true;
			buildFilters();
			render();
			setStatus('已讀取 ' + allRows.length + ' 筆紀錄（更新時間 ' + new Date().toLocaleTimeString('zh-TW', { hour12: false }) + '）');
		}).catch(function (e) {
			setStatus('讀取失敗：' + e.message + (e.fatal ? '（已停止自動更新）' : '（將於下次自動更新時重試）'), true);
			if (e.fatal) { $('auto').checked = false; saveAutoSetting(); }
		}).then(function () {
			loading = false;
			$('load').disabled = false;
			schedule();
		});
	}

	// 上一次讀取結束後才開始計時，避免連線慢時重疊呼叫
	function schedule() {
		stopTimer();
		if (!$('auto').checked || !$('key').value) { $('countdown').textContent = ''; return; }
		nextAt = Date.now() + intervalSec() * 1000;
		timer = setInterval(tick, 250);
		tick();
	}
	function tick() {
		var left = Math.ceil((nextAt - Date.now()) / 1000);
		if (left <= 0) { stopTimer(); $('countdown').textContent = '更新中…'; loadData(false); return; }
		$('countdown').textContent = left + ' 秒後更新';
	}
	function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
	function saveAutoSetting() {
		try {
			localStorage.setItem(INTERVAL_STORE, String(intervalSec()));
			localStorage.setItem(INTERVAL_STORE + '_auto', $('auto').checked ? '1' : '0');
		} catch (e) {}
	}

	$('load').onclick = function () { stopTimer(); loadData(true); };
	$('auto').onchange = function () { saveAutoSetting(); if (loadedOnce && !loading) schedule(); else if (!$('auto').checked) { stopTimer(); $('countdown').textContent = ''; } };
	$('interval').onchange = function () {
		$('interval').value = intervalSec();
		saveAutoSetting();
		if (loadedOnce && !loading) schedule();
	};
	// 已記住密碼時，開啟網頁就自動讀取
	if ($('key').value) setTimeout(function () { loadData(false); }, 0);

	$('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('load').click(); });

	// ---------- 資料整理 ----------
	// 欄位順序：競賽代碼 登錄帳號 競賽組別 題號 題目名稱 得分 評分時間 評分結果狀態 錯誤類型
	function toRecord(r, i) {
		return {
			contest: String(r[0] || '').trim(), account: String(r[1] || '').trim(), group: String(r[2] || '').trim(),
			no: String(r[3] || '').trim(), name: String(r[4] || '').trim(),
			score: Number(r[5]) || 0, timeText: String(r[6] || '').trim(), time: parseTime(r[6]),
			status: String(r[7] || '').trim(), errorType: String(r[8] || '').trim(), row: i
		};
	}
	function parseTime(s) {
		var m = String(s || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})\D+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
		return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime() : 0;
	}
	var natural = function (a, b) { return String(a).localeCompare(String(b), 'zh-Hant', { numeric: true, sensitivity: 'base' }); };
	function uniq(list) { return list.filter(function (v, i, a) { return v !== '' && a.indexOf(v) === i; }).sort(natural); }

	function fillSelect(sel, values) {
		var cur = sel.value;
		sel.innerHTML = '<option value="">全部</option>' + values.map(function (v) {
			return '<option>' + esc(v) + '</option>';
		}).join('');
		if (values.indexOf(cur) >= 0) sel.value = cur;
	}
	function buildFilters() {
		var recs = allRows.map(toRecord);
		fillSelect($('fContest'), uniq(recs.map(function (r) { return r.contest; })));
		fillSelect($('fGroup'), uniq(recs.map(function (r) { return r.group; })));
		$('filters').hidden = false;
	}
	['fContest', 'fGroup'].forEach(function (id) { $(id).onchange = render; });
	$('fAccount').oninput = render;

	// 依篩選條件，每位考生每題取最新一筆；回傳 { students, questions, rowCount }
	function aggregate() {
		var fc = $('fContest').value, fg = $('fGroup').value, fa = $('fAccount').value.trim().toLowerCase();
		var recs = allRows.map(toRecord).filter(function (r) {
			return r.account && r.no &&
				(!fc || r.contest === fc) && (!fg || r.group === fg) &&
				(!fa || r.account.toLowerCase().indexOf(fa) >= 0);
		});
		var students = {}, qset = {};
		recs.forEach(function (r) {
			var sk = r.contest + '\u0001' + r.group + '\u0001' + r.account;
			var st = students[sk] || (students[sk] = { contest: r.contest, group: r.group, account: r.account, q: {} });
			var cur = st.q[r.no];
			// 評分時間較新者取代；時間相同時，試算表中較後面（較晚寫入）的一筆取代
			if (!cur) st.q[r.no] = { rec: r, count: 1 };
			else {
				cur.count++;
				if (r.time > cur.rec.time || (r.time === cur.rec.time && r.row > cur.rec.row)) cur.rec = r;
			}
			qset[r.no] = qset[r.no] || r.name;
		});
		var list = Object.keys(students).map(function (k) {
			var st = students[k], total = 0, last = 0, lastText = '';
			Object.keys(st.q).forEach(function (no) {
				var rec = st.q[no].rec;
				total += rec.score;
				if (rec.time >= last) { last = rec.time; lastText = rec.timeText; }
			});
			st.total = total; st.answered = Object.keys(st.q).length; st.lastText = lastText;
			return st;
		}).sort(function (a, b) {
			return natural(a.account, b.account) || natural(a.group, b.group) || natural(a.contest, b.contest);
		});
		var questions = Object.keys(qset).sort(natural).map(function (no) { return { no: no, name: qset[no] }; });
		return { students: list, questions: questions, rowCount: recs.length };
	}

	// ---------- 畫面 ----------
	function esc(s) {
		return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
			return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
		});
	}
	var current = null;

	function render() {
		var a = current = aggregate();
		var multiContest = uniq(a.students.map(function (s) { return s.contest; })).length > 1;
		$('sAcc').textContent = a.students.length;
		$('sQ').textContent = a.questions.length;
		$('sRows').textContent = a.rowCount;
		$('secDetail').hidden = $('secTotal').hidden = false;

		if (!a.students.length) {
			$('tDetail').innerHTML = $('tTotal').innerHTML = '<tr><td class="empty">沒有符合條件的成績</td></tr>';
			return;
		}
		var lead = function (s) {
			return (multiContest ? '<td>' + esc(s.contest) + '</td>' : '') +
				'<td class="l">' + esc(s.account) + '</td><td>' + esc(s.group) + '</td>';
		};
		var leadHead = (multiContest ? '<th>競賽代碼</th>' : '') + '<th class="l">登錄帳號</th><th>競賽組別</th>';

		// 各題得分
		var h = '<thead><tr>' + leadHead + a.questions.map(function (q) {
			return '<th title="' + esc(q.name) + '">第 ' + esc(q.no) + ' 題</th>';
		}).join('') + '<th>總分</th></tr></thead><tbody>';
		a.students.forEach(function (s) {
			h += '<tr>' + lead(s);
			a.questions.forEach(function (q) {
				var c = s.q[q.no];
				if (!c) { h += '<td class="none">—</td>'; return; }
				var bad = c.rec.status === '錯誤';
				var tip = '評分時間 ' + c.rec.timeText + '｜' + (c.rec.status || '') +
					(c.rec.errorType ? '（' + c.rec.errorType + '）' : '') + '｜上傳 ' + c.count + ' 次';
				h += '<td' + (bad ? ' class="bad"' : '') + ' title="' + esc(tip) + '">' + c.rec.score +
					(c.count > 1 ? '<span class="n">×' + c.count + '</span>' : '') + '</td>';
			});
			h += '<td class="total">' + s.total + '</td></tr>';
		});
		$('tDetail').innerHTML = h + '</tbody>';

		// 總成績
		var t = '<thead><tr>' + leadHead + '<th>作答題數</th><th>總分</th><th>最後評分時間</th></tr></thead><tbody>';
		a.students.forEach(function (s) {
			t += '<tr>' + lead(s) + '<td>' + s.answered + '</td><td class="total">' + s.total + '</td><td>' + esc(s.lastText) + '</td></tr>';
		});
		$('tTotal').innerHTML = t + '</tbody>';
	}

	// ---------- 匯出 CSV（含 BOM，Excel 開啟不亂碼）----------
	function download(name, rows) {
		var csv = rows.map(function (r) {
			return r.map(function (v) {
				v = String(v == null ? '' : v);
				return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
			}).join(',');
		}).join('\r\n');
		var a = document.createElement('a');
		a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
		a.download = name;
		document.body.appendChild(a); a.click(); a.remove();
		setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
	}
	$('csvDetail').onclick = function () {
		if (!current) return;
		var rows = [['競賽代碼', '登錄帳號', '競賽組別'].concat(current.questions.map(function (q) { return '第' + q.no + '題'; }), ['總分'])];
		current.students.forEach(function (s) {
			rows.push([s.contest, s.account, s.group].concat(current.questions.map(function (q) {
				return s.q[q.no] ? s.q[q.no].rec.score : '';
			}), [s.total]));
		});
		download('各題得分.csv', rows);
	};
	$('csvTotal').onclick = function () {
		if (!current) return;
		var rows = [['競賽代碼', '登錄帳號', '競賽組別', '作答題數', '總分', '最後評分時間']];
		current.students.forEach(function (s) { rows.push([s.contest, s.account, s.group, s.answered, s.total, s.lastText]); });
		download('總成績.csv', rows);
	};

	// 測試用：window.__gradeReport.load(rows) 可直接載入資料
	window.__gradeReport = { load: function (rows) { allRows = rows; buildFilters(); render(); }, aggregate: function () { return aggregate(); } };
})();
</script>
</body>
</html>
