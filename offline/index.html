<!doctype html>
<html>
<head>
    <title>法蘭斯解題積木平台</title>
    <meta name="description" content="法蘭斯解題積木平台是由鳳山科技中心法蘭斯老師開發的積木程式解題與演算法測驗平台，整合 Gemini AI 解題助手，專為科技教育創意實作競賽資訊科技組設計。">
    <meta name="keywords" content="法蘭斯解題積木平台, 法蘭斯, 鳳山科技中心, 科技教育創意實作競賽, 資訊科技組, Blockly解題, Scratch解題">	
	<meta charset="utf-8">	
	<meta http-equiv="Access-Control-Allow-Headers" content="Origin, X-Requested-With, Content-Type, Accept">
	<meta http-equiv="Access-Control-Allow-Methods" content="GET,POST,PUT,DELETE,OPTIONS">
	<meta http-equiv="Access-Control-Allow-Origin" content="*">
	<meta http-equiv='Access-Control-Allow-Credentials' content='true'>	
	<link rel="icon" type="image/x-icon" href="favicon.ico" />
	<link rel="stylesheet" href="css/icon.css" />
	<link rel="stylesheet" href="css/custom.css" />
	<link rel="stylesheet" href="css/jquery-ui.css">
	<link rel="stylesheet" href="css/createFunction.css">	
	<script src="js/blockly_compressed.js"></script>
	<script src="js/blocks_compressed.js"></script>
	<script src="js/javascript_compressed.js"></script>
	<script src="js/custom.js"></script>	
	<script src="js/index.js"></script>
	<script src="js/message.js"></script>
	<script src="plugin/ScreenShot/screenshot.js"></script>
	<script src="js/jquery.min.js"></script>
	<script src="js/jquery-ui.js"></script>
	<script src="js/jquery.ui.touch-punch.min.js"></script>
	<script src="js/toolbox.js"></script>	
    <script src="js/beautify.js"></script>
	<script src="plugin/ContinuousToolbox/ContinuousCategory.js"></script>
	<script src="plugin/ContinuousToolbox/ContinuousMetrics.js"></script>  
	<script src="plugin/ContinuousToolbox/ContinuousFlyout.js"></script>
	<script src="plugin/ContinuousToolbox/ContinuousToolbox.js"></script>
	<script src="plugin/ContinuousToolbox/ContinuousMetricsFlyout.js"></script>
	<script src="exam/list.js"></script>

	<!-- ===== 統一色系（覆寫上方 CSS，需放在所有 link 之後） ===== -->
	<style>
		:root {
			--brand:       #4C5C8F;   /* 主色：與試題標題卡同色系 */
			--brand-dark:  #3B4A78;
			--brand-soft:  #EEF1F8;   /* 淺底：hover、選取 */
			--line:        #E2E6EF;   /* 分隔線 */
			--run:         #4CA35A;   /* 執行：呼應「迴圈」綠 */
			--run-dark:    #3D8A4A;
			--test:        #3F82C4;   /* 驗證：呼應藍色系 */
		}

		/* ---------- 上方工具列 ---------- */
		#main > table {
			width: 100%;
			height: 64px;
			border-collapse: collapse;
			background: #fff;
			border-bottom: 1px solid var(--line);
		}
		#tabs { align-items: center; }
		#tabs li a {
			color: var(--brand);
			font-weight: 600;
			font-size: 18px;
		}
		#tabs > a,
		#lang-toggle {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 48px;
			height: 48px;
			margin: 0 2px;
			border-radius: 10px;
			transition: background-color .2s, color .2s;
		}
		#tabs > a .material-icons,
		#lang-toggle.material-icons {
			font-size: 36px;
			padding: 0;
			line-height: 1;
			color: var(--brand);
		}
		#tabs > a:hover,
		#lang-toggle:hover { background: var(--brand-soft); }

		/* 執行：主要動作，實心綠色按鈕 */
		#button_run { background: var(--run); }
		#button_run:hover { background: var(--run-dark); }
		#tabs > #button_run .material-icons { color: #fff; }
		/* 驗證：藍色 */
		#tabs > #button_test .material-icons { color: var(--test); }

		.lang-wrap { display: inline-flex; align-items: center; }
		.lang-option:hover  { background: var(--brand-soft); }
		.lang-option.active { color: var(--brand); }

		/* ---------- 試題內容視窗 / 對話框標題列 ---------- */
		#javascript_content {
			border: 1px solid var(--line);
			border-radius: 8px;
			box-shadow: 0 4px 14px rgba(40, 50, 90, .15);
		}
		.ui-widget-header {
			background: var(--brand);
			border-color: var(--brand);
		}
		/* 試題內容標題列：淺底藍字，避免與下方深藍題目卡連成一片 */
		#javascript_title.ui-widget-header {
			background: var(--brand-soft);
			border: none;
			border-bottom: 1px solid var(--line);
			color: var(--brand);
			border-radius: 7px 7px 0 0;
		}
		#javascript_title .material-icons {
			font-size: 26px;
			color: var(--brand) !important;   /* 覆寫 HTML 內的 color: white */
		}
		#javascript_title a:hover .material-icons { color: var(--brand-dark) !important; opacity: .75; }

		/* ---------- 訊息視窗 ---------- */
		#consoleLog { border-color: var(--line); border-radius: 8px; }
		#console_header { background: var(--brand); }

		/* ---------- 建立積木 / 匯入題目 對話框 ---------- */
		.modal-container .header {
			background: var(--brand);
			color: #fff;
		}
		.action-button:hover { background: var(--brand-soft); }
		#confirmButton {
			background: var(--brand);
			border-color: var(--brand);
		}
		#confirmButton:hover { background: var(--brand-dark); }
		#importQuestion_list { border-color: #C9CFDD; }
		#importQuestionsList { border-color: var(--line); border-radius: 6px; }
		#importQuestionTable,
		#importQuestionTable tr,
		#importQuestionTable td { border-color: #C9CFDD; }
	</style>
</head>
<body class="root">
<main id="main" class="has-tabs" >
    <!-- PAGE TABS -->
	<table>
		<tr>
			<td style="width: calc(100vw - 480px);text-align: center;vertical-align: middle;">
				<ul id="tabs">
					<li id="tab_category_content"><a id="msg_toolbox">Toolbox</a></li>
				</ul>
			</td>			
			<td style="width: 480px;text-align: left;vertical-align: middle;">
				<ul id="tabs">
					<!-- https://fonts.google.com/icons -->
					<a href="#" id="button_run" title="Import your blocks"><i class="material-icons">play_arrow</i></a>
					<a href="#" id="button_test" title="Verification Program"><i class="material-icons">done</i></a>
					<a href="#" id="button_reset" title="Reset Workspace"><i class="material-icons">create</i></a>
					<a href="#" id="button_open_xml" title="Open xml file"><i class="material-icons">folder_open</i></a>
					<a href="#" id="button_save_xml" title="Save xml"><i class="material-icons">save</i></a>
					<a href="#" id="button_question" title="Import Question"><i class="material-icons">view_list</i></a>
                    <a href="#" id="button_page" title="Advanced Page"><i class="material-icons md-dark">meeting_room</i></a>  
					<a href="#" id="button_code" title="Show/Hide Output"><i class="material-icons">unfold_more</i></a>
                    <span class="lang-wrap">
                        <i class="material-icons" id="lang-toggle" title="Language">language</i>
                        <div id="lang-panel">
                            <span class="lang-option" data-lang="en">ENGLISH</span>
                            <span class="lang-option" data-lang="zh-hans">简体中文</span>
                            <span class="lang-option" data-lang="zh-hant">繁體中文</span>
                        </div>
                    </span>                
				</ul>
			</td>
		</tr>					
	</table>	
	  
	<!-- CONTENT  -->
	<div class="drop-shadow"></div>
	<div id="category_content" class="content">
		<div id="root"></div>
		<xml id="toolbox" style="display: none"></xml>
	</div>
	<div id="dialog_toolbox" onmousedown="textareaFocus('dialog_toolbox_parent');" ontouchstart="textareaFocus('dialog_toolbox_parent');"></div>
	
	<div id="javascript_content" class="ui-widget-content" onmousedown="textareaFocus('javascript_content');" ontouchstart="textareaFocus('javascript_content');">
		<div id="javascript_title" class="ui-widget-header">
			<span id="title_code"></span>
			<span class="contentzoom"><a href="#" id="button_copycode" title="Copy to clipboard"><i class="material-icons" style="vertical-align: middle; color: white;">featured_play_list</i></a></span>
			<span class="contentzoom_resize"><a id="button_resize" onclick="reloadZoom();" style="cursor: pointer" title="Resize"><i class="material-icons" style="vertical-align: middle; color: white;">refresh</i></a>	</span>		
			<span class="contentzoom_hide"><a id="button_hide" style="cursor: pointer" title="Hide"><i class="material-icons" style="vertical-align: middle; color: white;">keyboard_arrow_up</i></a>	</span>
			<span class="contentzoom_enlarge"><a id="button_enlarge" style="cursor: pointer" title="Enlarge"><i class="material-icons" style="vertical-align: middle; color: white;">aspect_ratio</i></a>	</span>
		</div>
		<div id="javascript_code" class="update_code">
			<div id="question_input" style="border: 1px solid #ddd;width:100%;height:60%;overflow: auto;padding:0px; overflow-y:auto; overflow-x:hidden;"></div>
            <iframe id="iframe_output" style="border: 1px solid #ddd;width:100%; height:35%; background-color:white; padding:0px; overflow-y:auto; overflow-x:hidden;" frameborder="0" src="" onload="this.contentWindow.document.body.style.wordWrap='break-word'; this.contentWindow.document.body.style.overflowX='hidden';"></iframe>
		</div>       
	</div>
	
    <div id="createFunction" class="modal-container">
        <div id="createFunction_content">
            <div id="createFunction_header" class="header">建立一個積木</div>
			<div class="form-group" style="display:none">
				<label id="createFunction_variable_label">參數列表</label>
				<div id="paramListContainer"></div>
			</div>			
            <div id="createFunctionDiv" style="width:700px;height:200px;"></div>
            <div class="button-group-param">
                <button id="createFunction_add_ns" class="param-button_ns">添加輸入方塊<br>數字或文字</button>
                <button id="createFunction_add_b" class="param-button_b">添加輸入方塊<br>布林值</button>
                <button id="createFunction_add_l" class="param-button_l">添加說明文字</button>
            </div>

            <div class="button-group-footer">
                <button id="cancelButton" class="action-button">取消</button>
                <button id="confirmButton" class="action-button">確定</button>
            </div>
        </div>
    </div>
	
    <div id="importQuestion" class="modal-container">
        <div id="importQuestion_content">
            <div id="importQuestion_header" class="header">匯入題目與測資資料</div>
            <div class="form-group-row">
                <label id="importQuestion_title" for="importQuestion_list">題庫名稱</label>
                <select id="importQuestion_list"></select>				
				<button id="importQuestionsButton" style="display:none;">查詢題庫</button>				
            </div>            
            <div class="form-group">
                <div id="importQuestionsList" style="overflow: auto;"></div>
            </div>
            <div class="button-group-footer">
                <button id="importCancelButton" class="action-button">取消</button>
            </div>           
        </div>
    </div>	
    
    <div id="consoleLog">
        <div id="console_header">
            <span id="console_title">訊息視窗</span>
            <a id="consoleCancelButton" title="Hide">
                <i class="material-icons">close</i>
            </a>
        </div>
        <div id="console_content">
            <div id="console_output"></div>
        </div>
    </div>       
</div>
</main>


</body>
</html>
